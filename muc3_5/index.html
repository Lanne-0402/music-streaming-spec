<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Home — MyMusic</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="player.js"></script>
</head>
<body>
  <header>
    <div>🎵 MyMusic</div>
    <div>
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="playlist.html">Playlist</a>
      <a href="artist.html">Artists</a>
    </div>
  </header>

  <div class="container">
    <h2>Gợi ý hôm nay</h2>
    <ul class="track-list">
      <li onclick="playTrack(0)">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Track cover 1">
        <div class="info">
          <div>Sunset Vibes</div>
          <div>Artist A</div>
        </div>
      </li>
      <li onclick="playTrack(1)">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500" alt="Track cover 2">
        <div class="info">
          <div>Dreaming High</div>
          <div>Artist B</div>
        </div>
      </li>
      <li onclick="playTrack(2)">
        <img src="https://images.unsplash.com/photo-1487215078519-e21cc028cb29?w=500" alt="Track cover 3">
        <div class="info">
          <div>Neon Lights</div>
          <div>Artist C</div>
        </div>
      </li>
    </ul>
  </div>

  <div class="player-bar">
    <div id="player-bar-now">Chưa chọn bài nào</div>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <button id="btn-next">▶</button>
    </div>
  </div>
</body>
</html>
