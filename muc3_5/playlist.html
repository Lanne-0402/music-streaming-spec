<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Playlist — MyMusic</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="player.js"></script>
</head>
<body>
  <header>
    <div>🎵 MyMusic</div>
    <div>
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="playlist.html">Playlist</a>
      <a href="artist.html">Artists</a>
    </div>
  </header>

  <div class="container">
    <h2>Playlist của tôi</h2>
    <ul class="track-list" id="plist">
      <li draggable="true" ondragstart="drag(event)" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2?w=400" alt="">
        <div class="info">Sunset Vibes — Artist A</div>
      </li>
      <li draggable="true" ondragstart="drag(event)" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=400" alt="">
        <div class="info">Dreaming High — Artist B</div>
      </li>
      <li draggable="true" ondragstart="drag(event)" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="https://images.unsplash.com/photo-1485579149621-3123dd979885?w=400" alt="">
        <div class="info">Neon Lights — Artist C</div>
      </li>
    </ul>
  </div>

  <div class="player-bar">
    <div id="player-bar-now">Chưa chọn bài nào</div>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <button id="btn-next">▶</button>
    </div>
  </div>

<script>
let dragSrcEl = null;
function allowDrop(ev){ ev.preventDefault(); }
function drag(ev){ dragSrcEl = ev.target; }
function drop(ev){ ev.preventDefault(); if(ev.target.tagName==='LI'){ const ul=document.getElementById('plist'); ul.insertBefore(dragSrcEl, ev.target.nextSibling); } }
</script>
</body>
</html>
