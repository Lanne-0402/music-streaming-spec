<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Artist Page — MyMusic</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="player.js"></script>
</head>
<body>
  <header>
    <div>🎵 MyMusic</div>
    <div>
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="playlist.html">Playlist</a>
      <a href="artist.html">Artists</a>
    </div>
  </header>

  <div class="container">
    <h2>Artist A</h2>
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500" alt="Artist portrait" style="border-radius: 50%; width:200px;">
    <h3>Album nổi bật</h3>
    <ul class="track-list">
      <li onclick="playTrack(0)">
        <img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2?w=400" alt="">
        <div class="info"><div>Sunset Vibes</div><div>Artist A</div></div>
      </li>
      <li onclick="playTrack(2)">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="">
        <div class="info"><div>Neon Lights</div><div>Artist A</div></div>
      </li>
    </ul>
  </div>

  <div class="player-bar">
    <div id="player-bar-now">Chưa chọn bài nào</div>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <button id="btn-next">▶</button>
    </div>
  </div>
</body>
</html>
