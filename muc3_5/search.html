<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Search — MyMusic</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="player.js"></script>
</head>
<body>
  <header>
    <div>🎵 MyMusic</div>
    <div>
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="playlist.html">Playlist</a>
      <a href="artist.html">Artists</a>
    </div>
  </header>

  <div class="container">
    <input type="text" id="input-search" placeholder="Tìm bài, nghệ sĩ...">
    <button onclick="doSearch()">Tìm</button>
    <ul class="track-list" id="search-results"></ul>
  </div>

  <div class="player-bar">
    <div id="player-bar-now">Chưa chọn bài nào</div>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <button id="btn-next">▶</button>
    </div>
  </div>

<script>
function doSearch() {
  const q = document.getElementById('input-search').value.toLowerCase();
  const ul = document.getElementById('search-results');
  ul.innerHTML = '';
  tracks.forEach((t,i) => {
    if (t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)) {
      const li = document.createElement('li');
      li.innerHTML = `<img src="${t.cover}" alt=""><div class="info"><div>${t.title}</div><div>${t.artist}</div></div>`;
      li.onclick = () => playTrack(i);
      ul.appendChild(li);
    }
  });
}
</script>

</body>
</html>
